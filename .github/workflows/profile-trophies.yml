name: Refresh profile trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-trophies.yml"

concurrency:
  group: profile-trophies-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure assets directory exists
        run: mkdir -p assets

      # Keep the renderer pinned; use a public scalar for cross-repository star counts.
      # GITHUB_TOKEN cannot read other repositories' stargazers connections.
      - name: Check out pinned trophy generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Erik-Donath/github-profile-trophy
          ref: eb0893b31de06841663555d10aa43eb7cf27952f
          path: .trophy-generator
          persist-credentials: false

      - name: Use public repository star counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          root = Path(".trophy-generator")
          changes = {
              "src/Schemas/index.ts": [
                  ("stargazers {\n            totalCount\n          }", "stargazerCount", 2),
              ],
              "src/user_info.ts": [
                  ("type Stargazers = { totalCount: number };\n", "", 1),
                  ("stargazers: Stargazers;", "stargazerCount: number;", 1),
                  ("node.stargazers.totalCount", "node.stargazerCount", 1),
              ],
          }
          for filename, replacements in changes.items():
              path = root / filename
              content = path.read_text()
              for old, new, expected in replacements:
                  if content.count(old) != expected:
                      raise SystemExit(f"Unexpected pinned generator source: {filename}")
                  content = content.replace(old, new)
              path.write_text(content)
          print("Using public stargazerCount instead of the repository-scoped stargazers connection.")
          PY

      - name: Verify profile API access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          from pathlib import Path
          
          source = Path(".trophy-generator/src/Schemas/index.ts").read_text()
          query = re.search(r"export const queryUserAll = `(.*?)`;", source, re.S).group(1)
          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"username": "alvrichh"}}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json"},
          )
          try:
              response = urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as error:
              response = error
          with response:
              print("GitHub API HTTP status:", response.status)
              print("Rate limit remaining:", response.headers.get("x-ratelimit-remaining", "unknown"))
              print("Rate limit reset:", response.headers.get("x-ratelimit-reset", "unknown"))
              payload = json.load(response)
          errors = payload.get("errors", [])
          for error in errors:
              print("GraphQL error:", error.get("type"), error.get("path"), error.get("message"))
          if errors or not (payload.get("data") or {}).get("user"):
              raise SystemExit("Profile API returned incomplete data; keeping the existing trophy card.")
          print("Profile API access verified.")
          PY

      - name: Generate trophy card
        uses: ./.trophy-generator
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: alvrichh
          file: assets/trophy.svg
          theme: tokyonight
          max-cols: "6"
          margin-width: "10"
          margin-height: "10"
          no-background: "true"
          no-frame: "true"

      - name: Validate trophy SVG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          path = Path("assets/trophy.svg")
          root = ET.fromstring(path.read_text())
          if root.tag != "{http://www.w3.org/2000/svg}svg":
              raise SystemExit("Generated file is not an SVG.")
          labels = "".join(root.itertext())
          if not all(label in labels for label in ("Stars", "Commits", "Followers", "Repositories")):
              raise SystemExit("Generated SVG is missing the expected trophy panels.")
          print(f"Validated trophy card ({path.stat().st_size} bytes).")
          PY

      - name: Commit refreshed trophy card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          if git diff --cached --quiet; then
            echo "Trophy card is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh trophy card"
          git pull --rebase origin main
          git push
