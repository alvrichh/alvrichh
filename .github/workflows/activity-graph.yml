name: Update activity graph

on:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activity-graph.yml"
      - "scripts/activity_graph.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/activity_graph.py

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg
          if git diff --cached --quiet; then
            echo "Activity graph is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh activity graph"
          git pull --rebase origin main
          git push
