<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="PROJECTS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#12091b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="72" rx="8" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="72" rx="2.5" fill="#00f0ff" filter="url(#glow)"/>
  <text x="30" y="34" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1">PROJECTS</text>
  <text x="30" y="55" fill="#8fa3bf" font-family="Consolas,Menlo,monospace" font-size="10" letter-spacing="0.8">SELECTED WORK & PRODUCTS</text>
  <line x1="760" y1="36" x2="965" y2="36" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
  <circle cx="972" cy="36" r="4" fill="#ff2e88" filter="url(#glow)"/>
</svg>