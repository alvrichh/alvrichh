<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img">
<style>
@font-face{font-family:'PS2P';src:url(data:font/woff2;base64,) format('woff2');}
.px{font-family:'PS2P','Press Start 2P',monospace;}
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="8"/>
</filter>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#07040f"/><stop offset="1" stop-color="#150a2e"/>
</linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffd23f"/><stop offset=".45" stop-color="#ff2e88"/><stop offset="1" stop-color="#7a1fa2"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2e88"/>
</linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="2" fill="#000" opacity=".22"/>
</pattern>
</defs>
<rect width="1000" height="76" fill="url(#bg)" rx="4"/>
<rect x="0" y="0" width="8" height="76" fill="#ff2e88"/>
<g transform="translate(46 38)">
  <g>
    <polygon points="0.0,-15.0 3.0,-3.0 15.0,0.0 3.0,3.0 0.0,15.0 -3.0,3.0 -15.0,0.0 -3.0,-3.0" fill="#dfe6f5"/>
    <circle r="2.1" fill="#07040f"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
  </g>
</g>
<text class="px" x="80" y="40" font-size="22" fill="#ff2e88" opacity=".9" transform="translate(3 2)">QUEST LOG</text>
<text class="px" x="80" y="40" font-size="22" fill="#ffffff">QUEST LOG</text>
<text class="px" x="80" y="62" font-size="10" fill="#00f0ff">MISSIONS COMPLETED &amp; IN PROGRESS</text>
<text class="px" x="975" y="40" font-size="10" fill="#ffd23f" text-anchor="end">STAGE 03</text>
<g class="px" font-size="10" fill="#9d8cc4"><text x="975" y="62" text-anchor="end">▶ READY</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.4s" repeatCount="indefinite"/></g>
<line x1="80" y1="72" x2="1000" y2="72" stroke="url(#neon)" stroke-width="2"/>
<rect width="1000" height="76" fill="url(#scan)"/>
</svg>