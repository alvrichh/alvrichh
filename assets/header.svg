<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Alvaro Rodriguez Molina — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset="0.58" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18091f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.48" stop-color="#ff5a7a"/>
      <stop offset="1" stop-color="#9a2bd8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="12" fill="url(#grid)"/>
  <circle cx="984" cy="160" r="124" fill="#ff2e88" opacity="0.17" filter="url(#soft)"/>
  <circle cx="984" cy="160" r="100" fill="url(#sun)"/>

  <g transform="translate(984 286) scale(0.92)">
    <line x1="-58" y1="-190" x2="52" y2="-74" stroke="#d8e0ef" stroke-width="5" stroke-linecap="round"/>
    <line x1="-58" y1="-190" x2="-34" y2="-164" stroke="#ff2e88" stroke-width="8" stroke-linecap="round"/>
    <path d="M22,-199 Q58,-210 92,-192 L89,-185 Q57,-201 22,-190 Z" fill="#ff2e88"/>
    <path d="M-34,0 L-16,-82 L0,-71 L16,-82 L34,0 L18,0 L5,-56 L-5,-56 L-18,0 Z" fill="#04060c"/>
    <path d="M-39,-80 L-47,-146 Q0,-161 47,-146 L39,-80 Z" fill="#04060c"/>
    <path d="M-45,-142 L-68,-105 L-58,-96 L-33,-129 Z" fill="#04060c"/>
    <path d="M45,-142 L68,-105 L58,-96 L33,-129 Z" fill="#04060c"/>
    <circle cx="0" cy="-178" r="28" fill="#04060c"/>
    <rect x="-42" y="-92" width="84" height="9" fill="#271028"/>
    <rect x="-30" y="-200" width="60" height="9" fill="#ff2e88"/>
    <rect x="-17" y="-184" width="34" height="6" rx="3" fill="#00f0ff" filter="url(#glow)"/>
  </g>

  <text x="64" y="112" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="0.5">ALVARO RODRIGUEZ MOLINA</text>
  <text x="66" y="162" fill="#00f0ff" font-family="Consolas,Menlo,monospace" font-size="24" font-weight="700">FULL STACK DEVELOPER</text>
  <text x="66" y="202" fill="#c4ccdc" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="1">INTEGRATION · AUTOMATION · CLOUD · APIS</text>
  <rect x="66" y="232" width="470" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>
  <text x="66" y="270" fill="#8190aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Building reliable products from interface to deployment.</text>
</svg>