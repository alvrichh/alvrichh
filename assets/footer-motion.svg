<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Building ideas end-to-end with code, integrations, automation, and cloud.">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00b8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7a5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4da6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="170" y1="24" x2="830" y2="24" stroke="url(#line)" stroke-width="2"/>
  <circle cx="170" cy="24" r="3.5" fill="#7a5cff" opacity="0.9">
    <animate attributeName="cx" values="170;830;170" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <text x="500" y="78" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21"
        font-style="italic" fill="#8b949e">
    Building ideas end-to-end with code, integrations, automation, and cloud.
  </text>
  <rect x="930" y="59" width="3" height="24" rx="1.5" fill="#7a5cff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.46;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>