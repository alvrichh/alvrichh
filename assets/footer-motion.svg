<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="Building ideas end-to-end with code, integrations, automation, and cloud.">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00b8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7a5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4da6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="250" y1="15" x2="750" y2="15" stroke="url(#line)" stroke-width="1.5"/>
  <circle cx="250" cy="15" r="2.5" fill="#7a5cff" opacity="0.8">
    <animate attributeName="cx" values="250;750;250" dur="6s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <text x="500" y="49" text-anchor="middle"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14"
        font-style="italic" fill="#8b949e">
    Building ideas end-to-end with code, integrations, automation, and cloud.
  </text>
  <rect x="820" y="37" width="2" height="16" rx="1" fill="#7a5cff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.46;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>