<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="Octocat illustration">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-1.8 140 140;1.8 140 140;-1.8 140 140"
        keyTimes="0;0.5;1"
        dur="4.8s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <image
        href="https://github.com/alvrichh/alvrichh/assets/81918923/0208f547-41f2-448f-970a-81a1f213dc6d"
        x="10" y="10" width="260" height="260"
        preserveAspectRatio="xMidYMid meet"/>
    </g>
  </g>
</svg>